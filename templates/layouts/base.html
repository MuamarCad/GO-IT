{{define "base"}}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{if .Description}}{{.Description}}{{else}}GO-IT: социальный код — профориентация в IT через практические кейсы, дорожные карты, наставничество и цифровое волонтёрство.{{end}}">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"historyCacheSize":0}'>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/unbounded-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme-init.js"></script>
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  {{template "header" .}}
  <main id="main">
    {{template "content" .}}
  </main>
  {{template "footer" .}}
</body>
</html>
{{end}}

{{define "lk_sidebar"}}
<aside class="lk-sidebar" aria-label="Личный кабинет">
  <div class="lk-user">
    <div class="lk-avatar" aria-hidden="true">{{.Data.Initials}}</div>
    <div>
      <div class="lk-user-name">{{.Data.UserName}}</div>
      <div class="lk-user-role">{{.Data.RoleLabel}}</div>
    </div>
  </div>
  <ul class="lk-nav">
    {{range .Data.Nav}}<li><a href="{{.Href}}" {{if eq .Key $.Active}}aria-current="page"{{end}}>{{template "lk_icon" .Icon}} {{.Label}}</a></li>
    {{end}}
    <li class="lk-logout-wrapper">
      <a class="lk-logout-btn" href="/">{{template "lk_icon" "door"}} Выйти</a>
    </li>
  </ul>
</aside>
{{end}}
